[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pallet-load-calculator"
version = "1.0.0"
description = "Offline uniform pallet load calculator reproducing onpallet.com results"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
keywords = ["pallet", "palletizing", "pallet loading problem", "logistics", "packing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Manufacturing",
]

[project.scripts]
palletcalc = "palletcalc:main"

[tool.setuptools]
py-modules = ["palletcalc"]
